name: CI and Deploy Moni

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: moni-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/zehrtydev/moni-web

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
        run: npm run build

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Validate Docker Compose
        working-directory: .
        run: |
          docker compose \
            --env-file .env.production.example \
            --env-file .env.release.example \
            -f docker-compose.prod.yml \
            config --quiet

      - name: Validate Supabase migrations and RLS
        working-directory: .
        run: ./scripts/validate-supabase-migrations.sh


  publish:
    name: Build and publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - quality

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish Moni
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true

          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

          cache-from: type=gha
          cache-to: type=gha,mode=max


  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'

    needs:
      - publish

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}

        run: |
          set -euo pipefail

          install -d -m 700 "$HOME/.ssh"

          printf '%s\n' "$VPS_SSH_KEY" \
            > "$HOME/.ssh/moni_deploy"

          chmod 600 "$HOME/.ssh/moni_deploy"

          ssh-keyscan \
            -T 10 \
            -t ed25519 \
            "$VPS_HOST" \
            > "$HOME/.ssh/known_hosts" \
            2>/dev/null

          test -s "$HOME/.ssh/known_hosts"

          ACTUAL_FINGERPRINT="$(
            ssh-keygen \
              -lf "$HOME/.ssh/known_hosts" \
              -E sha256 |
            awk 'NR == 1 { print $2 }'
          )"

          test "$ACTUAL_FINGERPRINT" = "$VPS_HOST_FINGERPRINT"

          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy Moni
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}

        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/moni_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" \
            "deploy-moni $GITHUB_SHA"

      - name: Verify public health
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 10 \
            --retry-delay 3 \
            --connect-timeout 5 \
            --max-time 15 \
            https://moni.zehrty.dev/api/health
